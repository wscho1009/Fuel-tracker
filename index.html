<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel Tracker</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f5fb; --ink: #1c1730; --muted: #55496f;
    --dim: #8a80a3; --line: #e2dcf0; --accent: #6a3fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141220; --panel: #1d1a2c; --ink: #f1eefa; --muted: #b8afd0;
      --dim: #7f769a; --line: #302b45; --accent: #a78bfa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Noto Sans KR", "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 24px 96px; }
  h1 { font-size: 28px; line-height: 1.3; margin: 0 0 6px; letter-spacing: -0.02em; }
  h2 {
    font-size: 19px; margin: 44px 0 12px; padding-top: 22px;
    border-top: 1px solid var(--line); letter-spacing: -0.01em;
  }
  h3 { font-size: 16px; margin: 24px 0 8px; }
  p, li { color: var(--muted); }
  strong { color: var(--ink); }
  .lede { font-size: 15px; color: var(--dim); margin: 0 0 32px; }
  .box {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; margin: 20px 0;
  }
  .box p:first-child { margin-top: 0; }
  .box p:last-child { margin-bottom: 0; }
  .fill { color: #b4342b; font-weight: 700; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .fill { color: #ff8a7d; }
  }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink); font-weight: 700; width: 34%; }
  td { color: var(--muted); }
  code { font-size: 0.92em; background: var(--panel); padding: 1px 5px; border-radius: 4px; }
  a { color: var(--accent); }
  .lang-sep { margin-top: 80px; padding-top: 40px; border-top: 3px solid var(--line); }
  ul { padding-left: 20px; }
  li { margin: 6px 0; }
</style>
</head>
<body>
<main>
<h1>Fuel Tracker</h1>
<p class="lede">지금 내 몸에 남은 카페인을 반감기로 계산하는 iPhone 앱 · Track the caffeine in your body by half-life.</p>
<ul>
<li><a href="support.html">고객지원 · Support</a></li>
<li><a href="terms.html">이용약관 · Terms of Use</a></li>
<li><a href="privacy.html">개인정보처리방침 · Privacy Policy</a></li>
</ul>
</main>
</body>
</html>
