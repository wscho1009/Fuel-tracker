<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel Tracker — See how much caffeine is still in you</title>
<meta name="description" content="Fuel Tracker is a caffeine log for iPhone. Log a drink in one tap and see how much caffeine is still in your body, how strongly you feel it, and how much will be left at bedtime.">
<meta name="apple-itunes-app" content="app-id=6818583602">
<link rel="icon" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="Fuel Tracker — My Caffeine Log">
<meta property="og:description" content="See how much caffeine is still in you, and how much will be left at bedtime.">
<meta property="og:image" content="https://wscho1009.github.io/Fuel-tracker/assets/icon-256.png">
<style>
  :root {
    --bg:#F1EDFB; --panel:#FFFFFF; --line:#CFC2F0; --lip:#D7CBF3;
    --ink:#241A3F; --muted:#5E4E86; --dim:#9C8EC4; --accent:#8B5CF6; --accentLip:#6A3FD6; --orange:#FF8A3D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#15111F; --panel:#241E36; --line:#4A3E70; --lip:#16112A;
      --ink:#F3EFFF; --muted:#B9AADD; --dim:#7E71A6; --accent:#A78BFA;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:17px/1.6 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:28px 16px 72px; }
  nav { display:flex; justify-content:flex-end; gap:4px; }
  nav button { border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:999px; padding:4px 12px; font:inherit; font-size:14px; cursor:pointer; }
  nav button[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  header { text-align:center; padding:28px 0 8px; }
  header img { width:112px; height:112px; border-radius:26px; box-shadow:0 12px 32px rgba(80,40,170,.25); }
  h1 { font-size:40px; line-height:1.1; letter-spacing:-0.025em; margin:22px 0 12px; font-weight:900; }
  .lede { color:var(--muted); font-size:19px; margin:0 auto 26px; max-width:520px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn { display:inline-block; text-decoration:none; font-weight:800; border-radius:16px; padding:14px 22px; }
  .primary { background:var(--accent); color:#fff; box-shadow:0 5px 0 var(--accentLip); }
  .secondary { background:var(--panel); color:var(--ink); border:2px solid var(--line); box-shadow:0 5px 0 var(--lip); }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:44px 0; }
  .f { background:var(--panel); border:2px solid var(--line); border-radius:22px; padding:16px 18px; box-shadow:0 5px 0 var(--lip); }
  .f b { display:block; font-size:17px; margin-bottom:4px; }
  .f span { color:var(--muted); font-size:15px; line-height:1.5; display:block; }
  .note { font-size:14px; color:var(--dim); text-align:center; max-width:560px; margin:0 auto; }
  footer { margin-top:40px; text-align:center; font-size:14px; }
  footer a { color:var(--muted); margin:0 8px; }
  footer p { color:var(--dim); font-size:13px; margin-top:16px; }
  @media (max-width:520px) { .grid { grid-template-columns:1fr; } h1 { font-size:32px; } }
</style>
</head>
<body>
<main>
<nav><button data-l="en">EN</button><button data-l="ko">한국어</button></nav>
<header>
  <img src="assets/icon-256.png" alt="Fuel Tracker app icon">
  <h1 data-t="h1"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="btns">
    <a class="btn primary" href="https://apps.apple.com/app/id6818583602" data-t="get"></a>
    <a class="btn secondary" id="calcLink" href="calculator.html" data-t="calc"></a>
  </div>
</header>

<section class="grid">
  <div class="f"><b data-t="f1"></b><span data-t="f1s"></span></div>
  <div class="f"><b data-t="f2"></b><span data-t="f2s"></span></div>
  <div class="f"><b data-t="f3"></b><span data-t="f3s"></span></div>
  <div class="f"><b data-t="f4"></b><span data-t="f4s"></span></div>
  <div class="f"><b data-t="f5"></b><span data-t="f5s"></span></div>
  <div class="f"><b data-t="f6"></b><span data-t="f6s"></span></div>
</section>

<p class="note" data-t="note"></p>

<footer>
  <a href="support.html" data-t="support"></a><a href="privacy.html" data-t="privacy"></a><a href="terms.html" data-t="terms"></a>
  <p data-t="biz"></p>
</footer>
</main>
<script>
const T = {
  en: { h1:"See how much caffeine is still in you",
    lede:"Log a drink in one tap. Fuel Tracker shows the caffeine left in your body, how strongly you feel it, and how much will be left at bedtime.",
    get:"Download on the App Store", calc:"Try the free calculator",
    f1:"How much you feel it right now", f1s:"One gauge across five levels, from Off to Redlining, with the milligrams still in your system.",
    f2:"What will be left at bedtime", f2s:"Set your usual bedtime and get a simple sleep outlook before you pour another cup.",
    f3:"12 hours either way", f3s:"A curve of the last 12 hours and the next 12 shows when each drink peaks and fades.",
    f4:"Nearly 100 drinks built in", f4s:"Search by brand or product, or pin your usuals as one-tap shortcuts.",
    f5:"Limits scaled to you", f5s:"Per-serving and daily guides from your body weight, based on published references such as EFSA.",
    f6:"Your data stays on your iPhone", f6s:"No account, no ads, no tracking. A home screen widget shows your level at a glance.",
    note:"Fuel Tracker is not a medical device. Its numbers are estimates from a general pharmacokinetic model, not medical advice.",
    support:"Support", privacy:"Privacy Policy", terms:"Terms of Use",
    biz:"Fuel Tracker (퓰 트레커) · Wooseok Cho · Business reg. 571-35-01861 · Mail-order report 2026-Seoul Seongdong-1493" },
  ko: { h1:"지금 내 몸에 카페인이 얼마나 남았을까",
    lede:"한 번 탭해서 기록하면, 몸에 남은 카페인과 지금 느껴지는 강도, 잠들 때 남을 양까지 바로 보여줘요.",
    get:"App Store에서 받기", calc:"무료 계산기 써보기",
    f1:"지금 얼마나 느껴지는지", f1s:"'잠수 중'부터 '광전사'까지 다섯 단계 계기판과 남은 mg을 한눈에.",
    f2:"잠들 때 남을 양", f2s:"취침 시각을 넣어 두면 한 잔 더 마시기 전에 수면 예보를 볼 수 있어요.",
    f3:"앞뒤 12시간", f3s:"지난 12시간과 앞으로 12시간 곡선으로 한 잔이 언제 세지고 언제 빠지는지 보여요.",
    f4:"음료 100여 종 내장", f4s:"브랜드·제품으로 검색하고, 자주 마시는 건 바로가기로 고정해요.",
    f5:"내 몸에 맞춘 권장량", f5s:"한 번·하루 권장량을 체중에 맞춰 계산해요. EFSA 등 공개 기준을 바탕으로 해요.",
    f6:"기록은 아이폰 안에만", f6s:"계정·광고·추적 없음. 홈 화면 위젯으로 지금 수치를 바로 봐요.",
    note:"Fuel Tracker는 의료기기가 아니에요. 앱의 숫자는 일반적인 약동학 모델로 계산한 추정치이며 의료 조언이 아니에요.",
    support:"고객지원", privacy:"개인정보 처리방침", terms:"이용약관",
    biz:"퓰 트레커 · 대표 조우석 · 사업자등록번호 571-35-01861 · 통신판매업 신고 제 2026-서울성동-1493 호" }
};
function setLang(l){
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = T[l][e.dataset.t]);
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l===l));
  document.getElementById("calcLink").href = "calculator.html?lang="+l;
  document.title = l==="ko" ? "Fuel Tracker — 지금 내 몸에 남은 카페인" : "Fuel Tracker — See how much caffeine is still in you";
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => setLang(b.dataset.l));
setLang((new URLSearchParams(location.search).get("lang")) || ((navigator.language||"").startsWith("ko") ? "ko" : "en"));
</script>
</body>
</html>
